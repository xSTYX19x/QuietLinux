# cargo-deny: checks dependencies for security advisories, licenses and sources.
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
yanked = "deny"

[licenses]
# Licenses in use, all compatible with GPL-3.0-or-later. Add others (e.g. BSD,
# ISC, Zlib) only when a new dependency needs them.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "GPL-3.0-only",  # Slint (GUI), its GPL option
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
