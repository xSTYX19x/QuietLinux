# cargo-about: which licenses may appear in THIRD-PARTY-LICENSES.html
# (packaging/dist.sh). Keep in line with [licenses] in deny.toml.
accepted = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# only what the programs contain: no build and test dependencies
ignore-build-dependencies = true
ignore-dev-dependencies = true
# the packages are built for this target only
targets = ["x86_64-unknown-linux-gnu"]
